name: Build

on:
  push:
    branches: [main, master, ida9]
  pull_request:
    branches: [main, master, ida9]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone IDA SDK
        run: |
          git clone --depth 1 --branch v9.2 `
            https://github.com/HexRaysSA/ida-sdk.git `
            ${{ github.workspace }}\ida-sdk

      - name: Configure CMake
        env:
          IDASDK: ${{ github.workspace }}\ida-sdk
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: idasourcemod
          path: build/**/Release/idasourcemod.dll
